<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Kobayashi - Software Portfolio</title>
    
    <link rel="icon" type="image/png" href="/assets/images/icons/favicon.png"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;300;400;500;600;700;800;900&family=Edu+TAS+Beginner:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0f000f;
            color: #ffffff;
        }
        .logoName {
            font-family: 'Edu TAS Beginner', cursive;
            font-style: italic;
        }
        /* Style for active filter button */
        .tag-active {
            background-color: #a855f7 !important;
            color: white !important;
            border-color: #a855f7 !important;
        }
    </style>
</head>

<body>
    <div class="header min-h-screen flex flex-col">
        <div class="container mx-auto px-4 w-full">

            <div id="navbar-placeholder"></div>

            <main class="py-12">
                <h1 class="text-5xl font-extrabold text-center mb-6 border-b-2 border-purple-500 pb-4">Software Portfolio</h1>

                <!-- Filter buttons -->
                <div id="filter-bar" class="flex flex-wrap justify-center gap-3 mb-12">
                    </div>

                <!-- Projects -->
                <div id="project-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    </div>

                <!-- Skills section -->
                <div class="mt-20 p-8 rounded-xl bg-gray-900/70 border border-purple-900">
                    <h2 class="text-2xl font-bold mb-4 border-b border-purple-700 pb-2">Technical Core Competencies</h2>
                    <ul id="skills-list" class="text-lg space-y-2 lg:columns-2">
                        </ul>
                </div>
            </main>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/projects.js"></script>
</body>
</html>
