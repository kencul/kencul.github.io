<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Kobayashi</title>
    <link rel="icon" type="image/png" href="/assets/images/icons/favicon.png"> 
    <!-- Load Tailwind CSS from CDN for responsive utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load custom fonts from Google Fonts API -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;300;400;500;600;700;800;900&family=Edu+TAS+Beginner:wght@600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <!-- The hero section is set to a minimum height of the viewport to fill the screen -->
    <div class="header min-h-screen flex flex-col">
        <div class="container mx-auto px-4 w-full">

            <!-- Navbar -->
            <div id="navbar-placeholder"></div>

            <!-- Hero content section -->
            <div class="hero-row flex flex-col md:flex-row items-center justify-between mt-8 md:mt-4 md:h-[calc(100vh-100px)]">
                <!-- Left text column -->
                <div class="w-full md:w-1/2 text-center md:text-left mb-10 md:mb-0">
                    <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold leading-tight mb-2">Ken Kobayashi</h1>
                    <h2 class="text-2xl sm:text-3xl md:text-4xl font-light leading-snug text-purple-200">Sound Enginner & Audio Developer</h2>
                    <p class="italic text-sm sm:text-base mt-4 max-w-lg mx-auto md:mx-0 leading-relaxed text-gray-300">
                        Using technology to push the boundaries of art and technology
                    </p>
                    <div class="mt-2">
                        <!-- Buttons for call to action to listen to music or look at projects -->
                        <a href="./music" class="inline-block px-5 py-3 mt-8 text-lg font-semibold text-[rgb(41,41,41)] bg-[#f0f0f0] rounded-[40px] shadow-lg transition-all transform hover:scale-105 hover:bg-[rgb(98,54,121)] hover:text-white duration-900">My Music &rarr;</a>
                        <a href="./programming" class="inline-block px-5 py-3 mt-8 text-lg font-semibold text-[rgb(41,41,41)] bg-[#f0f0f0] rounded-[40px] shadow-lg transition-all transform hover:scale-105 hover:bg-[rgb(98,54,121)] hover:text-white duration-900 ml-4">My Projects! &rarr;</a>
                    </div>
                </div>

                <!-- Right image column -->
                <div class="w-full md:w-1/2 flex justify-center items-center h-96 md:h-full image-container">
                    <!-- The image classes are now applied directly -->
                    <img src="./assets/images/photos/2.jpeg" class="w-full h-full object-contain rounded-[40%] shadow-2xl" alt="A professional photo of Ken Kobayashi">
                </div>
            </div>

        </div>
    </div>
    <!-- JavaScript to load the navbar -->
    <script src="/assets/js/common.js"></script>
</body>
</html>
